<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>5th Grade Math</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧮</text></svg>">
<style>
  :root { --gap: clamp(10px, 3vw, 18px); --hdr: 92px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  body { overflow: hidden; }

  .screen {
    position: fixed; inset: 0;
    display: none; flex-direction: column; align-items: center;
    padding: max(env(safe-area-inset-top), 12px) 14px max(env(safe-area-inset-bottom), 14px);
  }
  .screen.active { display: flex; }

  /* Top bar (mode toggle + score) — only on BETWEEN-problem screens, never during a question */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: max(env(safe-area-inset-top), 10px) 10px 8px;
    display: none; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px;
    z-index: 60; font-weight: 800; pointer-events: none;
    background: linear-gradient(#000 80%, rgba(0,0,0,0));
  }
  .topbar.show { display: flex; }
  .mode-seg, .map-tabs {
    display: flex; gap: 6px; pointer-events: auto;
    background: #15151c; border: 2px solid #2c2c3a; border-radius: 999px; padding: 4px;
  }
  .map-tabs { margin: 8px 0 2px; }
  .seg-btn {
    appearance: none; border: none; background: transparent; color: #9aa0b5;
    font-weight: 800; font-size: clamp(12px, 3.4vw, 16px); padding: 8px 14px; white-space: nowrap;
    border-radius: 999px; cursor: pointer; touch-action: manipulation; transition: background .12s ease, color .12s ease;
  }
  .map-tabs .seg-btn { font-size: clamp(14px, 4vw, 18px); padding: 8px 18px; }
  .seg-btn.active { background: #6a4bd6; color: #fff; }
  .seg-btn.add.active { background: #2bb673; color: #fff; }
  .tb-scoreline { display: flex; align-items: center; gap: 16px; }
  .tb-score { font-size: clamp(17px, 4.6vw, 22px); }
  .tb-score b { color: #ffd84d; }
  .tb-best { font-size: clamp(13px, 3.8vw, 17px); color: #9aa0b5; }
  .tb-best b { color: #cfd2e0; }
  /* Between-problem screens leave room for the bar */
  #celebrateScreen, #teachScreen { padding-top: calc(max(env(safe-area-inset-top), 10px) + var(--hdr)); }
  #mapScreen { padding-top: calc(max(env(safe-area-inset-top), 10px) + 12px); }

  /* ---------- Problem screen (focus-only) ---------- */
  #problemScreen { justify-content: space-between; }
  .problem-top {
    flex: 1 1 auto; width: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0;
  }
  .problem { font-size: clamp(56px, 17vw, 130px); font-weight: 800; letter-spacing: 2px; line-height: 1.1; text-align: center; }
  .problem .x { color: #7ad0ff; margin: 0 0.12em; }
  .problem .op { color: #7ad0ff; margin: 0 0.12em; }
  .problem .op.add { color: #7bd06a; }
  .answer-display {
    margin-top: clamp(14px, 4vw, 28px); min-height: 1.3em;
    font-size: clamp(40px, 12vw, 84px); font-weight: 800; color: #ffd84d;
    border-bottom: 4px solid #33333f; min-width: 2.2em; text-align: center; padding: 0 0.2em 4px;
  }
  .answer-display.empty { color: #555; }
  .guess-hint { font-size: clamp(14px, 4vw, 18px); color: #8a8f9e; margin-top: 12px; font-weight: 600; }

  /* Keypad */
  .keypad { flex: 0 0 auto; width: 100%; max-width: 480px; display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); margin-top: var(--gap); }
  .key {
    appearance: none; border: none; background: #1c1c26; color: #fff;
    font-size: clamp(28px, 8vw, 40px); font-weight: 700; border-radius: 18px;
    padding: clamp(14px, 4.5vw, 26px) 0; cursor: pointer;
    transition: transform .06s ease, background .12s ease; touch-action: manipulation;
  }
  .key:active { transform: scale(0.94); background: #2a2a3a; }
  .key.back { background: #2a2230; color: #ffb3c7; }
  .key.check { background: #2bb673; color: #fff; font-weight: 800; font-size: clamp(22px, 6.5vw, 32px); }
  .key.check:active { background: #229c61; }

  /* ---------- Estimation screen (focus-only) ---------- */
  #estimateScreen { justify-content: center; text-align: center; }
  .est-q { font-size: clamp(26px, 7.5vw, 44px); font-weight: 800; margin: 0 14px 10px; line-height: 1.15; }
  .est-q .x { color: #7ad0ff; } .est-q .t { color: #ffd84d; }
  .est-sub { font-size: clamp(16px, 4.5vw, 20px); color: #cfd2e0; margin-bottom: 26px; font-weight: 600; }
  .est-btns { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; }
  .est-btn { appearance: none; border: none; border-radius: 20px; padding: clamp(20px, 6vw, 32px); font-size: clamp(22px, 6.5vw, 30px); font-weight: 800; color: #fff; cursor: pointer; touch-action: manipulation; transition: transform .06s ease; }
  .est-btn:active { transform: scale(0.97); }
  .est-more { background: #3f7fd6; } .est-less { background: #d6743f; }
  .est-feedback { min-height: 1.5em; margin-top: 20px; font-size: clamp(18px, 5vw, 24px); font-weight: 800; color: #7bd06a; }

  /* ---------- Celebration screen ---------- */
  #celebrateScreen { justify-content: center; text-align: center; }
  .burst {
    position: absolute; top: 50%; left: 50%; width: min(125vw, 560px); height: min(125vw, 560px);
    transform: translate(-50%, -56%) scale(.2); border-radius: 50%; pointer-events: none; opacity: 0; z-index: 0;
    background: repeating-conic-gradient(from 0deg, rgba(255,216,77,.18) 0deg, rgba(255,216,77,0) 7deg, rgba(255,216,77,0) 14deg);
  }
  .burst.gold { background: repeating-conic-gradient(from 0deg, rgba(255,196,0,.36) 0deg, rgba(255,120,0,0) 6deg, rgba(255,196,0,0) 12deg); }
  .burst.go { animation: burst 1.1s ease-out; }
  @keyframes burst {
    0% { opacity: 0; transform: translate(-50%,-56%) scale(.2) rotate(0deg); }
    25% { opacity: .95; }
    100% { opacity: 0; transform: translate(-50%,-56%) scale(1.15) rotate(45deg); }
  }
  .cele-emoji { position: relative; z-index: 1; font-size: clamp(80px, 26vw, 170px); animation: pop 0.6s ease, wiggle 1.6s ease-in-out infinite 0.6s; }
  .cele-msg { position: relative; z-index: 1; font-size: clamp(30px, 8.5vw, 50px); font-weight: 800; margin: 18px 14px 6px; color: #fff; }
  .cele-msg.bonus { color: #ffd84d; text-shadow: 0 0 18px rgba(255,216,77,.5); }
  .cele-sub { position: relative; z-index: 1; font-size: clamp(18px, 5vw, 26px); font-weight: 700; color: #ffd84d; margin-bottom: 26px; }
  @keyframes pop { 0% { transform: scale(0);} 70% { transform: scale(1.25);} 100% { transform: scale(1);} }
  @keyframes wiggle { 0%,100% { transform: translateY(0) rotate(-4deg);} 50% { transform: translateY(-14px) rotate(4deg);} }

  /* Confetti */
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .confetti span { position: absolute; top: -10%; font-size: clamp(22px, 6vw, 34px); animation: fall linear forwards; }
  @keyframes fall { 0% { transform: translateY(-12vh) rotate(0deg);} 100% { transform: translateY(112vh) rotate(560deg);} }

  /* ---------- Teaching screen ---------- */
  #teachScreen { justify-content: flex-start; }
  .teach-scroll { width: 100%; flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; align-items: center; }
  .equation { font-size: clamp(40px, 12vw, 84px); font-weight: 800; text-align: center; margin-top: clamp(6px, 2vw, 16px); }
  .equation .x { color: #7ad0ff; } .equation .eq { color: #2bb673; } .equation .prod { color: #ffd84d; }
  .equation .op { color: #7ad0ff; } .equation .op.add { color: #7bd06a; }

  .illo-caption { font-size: clamp(18px, 5.2vw, 27px); font-weight: 800; text-align: center; margin: 16px 10px 6px; color: #fff; line-height: 1.25; }
  .illo-caption .hl { color: #ffd84d; }
  .illo-answer { font-size: clamp(18px, 5vw, 26px); font-weight: 800; text-align: center; margin: 8px 12px 4px; color: #fff; }
  .illo-answer .hl { color: #ffd84d; }
  .illo { width: 100%; max-width: 640px; display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: clamp(8px, 2.5vw, 16px); padding: 8px 4px 12px; }
  .group-box { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.12); border-radius: 18px; padding: clamp(6px, 2vw, 12px); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .group-label { font-size: clamp(20px, 6vw, 32px); line-height: 1; }
  .group-items { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(2px, 1.2vw, 6px); max-width: 6.2em; }
  .obj { font-size: clamp(18px, 5.5vw, 30px); line-height: 1; animation: pop 0.4s ease backwards; }
  .empty-note { font-size: clamp(13px, 3.6vw, 17px); color: #9aa0b5; font-weight: 700; }
  .svg-group { width: clamp(108px, 29vw, 156px); height: clamp(108px, 29vw, 156px); }

  /* Grid / array (area-model) view */
  .grid { display: inline-grid; gap: clamp(3px, 1.4vw, 7px); padding: 8px; }
  .dot { width: clamp(13px, 4.6vw, 24px); height: clamp(13px, 4.6vw, 24px); border-radius: 50%; animation: pop 0.35s ease backwards; }

  /* Addition "combine into one pile" view */
  .pile { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: clamp(4px, 1.8vw, 9px); max-width: 560px; padding: 12px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.12); border-radius: 22px; }
  .add-item { width: clamp(26px, 8vw, 40px); height: clamp(26px, 8vw, 40px); animation: pop 0.35s ease backwards; }
  .plus-chip { font-size: clamp(24px, 7vw, 36px); font-weight: 800; color: #ffd84d; margin: 0 6px; }

  /* ---------- Mastery map screen ---------- */
  #mapScreen { justify-content: flex-start; }
  .map-title { font-size: clamp(26px, 7vw, 38px); font-weight: 800; margin-top: 4px; }
  .map-sub { font-size: clamp(15px, 4vw, 19px); color: #ffd84d; font-weight: 700; margin: 6px 0 12px; }
  .map-scroll { flex: 1 1 auto; width: 100%; overflow: auto; display: flex; justify-content: center; }
  .map-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; width: 100%; max-width: 440px; align-content: start; }
  .map-cell { aspect-ratio: 1 / 1; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: clamp(9px, 2.6vw, 13px); font-weight: 700; color: rgba(255,255,255,0.9); }

  /* Buttons */
  .big-btn { appearance: none; border: none; width: 100%; max-width: 480px; border-radius: 20px; padding: clamp(16px, 5vw, 24px) 18px; font-size: clamp(20px, 6vw, 28px); font-weight: 800; cursor: pointer; touch-action: manipulation; transition: transform .06s ease, background .12s ease; }
  .big-btn:active { transform: scale(0.97); }
  .btn-illo { background: #6a4bd6; color: #fff; }
  .btn-illo:active { background: #5a3fc0; }
  .btn-next { background: #2bb673; color: #fff; }
  .btn-next:active { background: #229c61; }
  .btn-map { background: #2a2a3a; color: #ffd84d; font-size: clamp(16px, 4.6vw, 20px); padding: clamp(11px, 3.4vw, 15px) 18px; }
  .btn-row { flex: 0 0 auto; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 10px; }

  /* ===== Grade 5 additions ===== */
  .hl { color: #ffd84d; }
  .seg-btn.m-ops.active { background: #6a4bd6; color: #fff; }
  .seg-btn.m-md.active { background: #3f7fd6; color: #fff; }
  .seg-btn.m-as.active { background: #2bb673; color: #fff; }
  .seg-btn.m-word.active { background: #d6743f; color: #fff; }
  .mode-seg { gap: 3px; padding: 3px; }
  .mode-seg .seg-btn { font-size: clamp(11px, 3.3vw, 15px); padding: 8px clamp(8px, 2.6vw, 13px); }
  .map-tabs { flex-wrap: wrap; justify-content: center; }
  .map-tabs .seg-btn { font-size: clamp(12px, 3.4vw, 16px); padding: 7px 12px; }

  .problem.mid { font-size: clamp(40px, 12vw, 100px); }
  .problem.expr { font-size: clamp(30px, 8.4vw, 64px); line-height: 1.3; padding: 0 8px; letter-spacing: 0; }
  .problem.word { font-size: clamp(19px, 5.3vw, 30px); line-height: 1.4; font-weight: 700; padding: 0 10px; max-width: 640px; letter-spacing: 0; text-align: left; }
  .problem .br { color: #8a8f9e; }
  .problem .num, .equation .num { color: #ffd84d; font-weight: 800; }

  .equation.med { font-size: clamp(28px, 8vw, 56px); }
  .equation.small { font-size: clamp(22px, 6vw, 40px); }
  .equation .br { color: #8a8f9e; }
  .equation.word { font-size: clamp(17px, 4.7vw, 24px); font-weight: 700; text-align: left; padding: 0 10px; max-width: 640px; line-height: 1.4; }
  .wp-ans { font-size: clamp(22px, 6.4vw, 34px); font-weight: 800; margin-top: 12px; text-align: center; }

  .steps { width: 100%; max-width: 640px; display: flex; flex-direction: column; gap: 10px; padding: 8px 4px 14px; }
  .step { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.12); border-radius: 16px; padding: 10px 14px; animation: pop 0.35s ease backwards; text-align: left; }
  .step .lab { font-size: clamp(13px, 3.6vw, 16px); color: #9aa0b5; font-weight: 800; letter-spacing: .3px; }
  .step .calc { font-size: clamp(18px, 5vw, 26px); font-weight: 800; color: #fff; margin-top: 2px; line-height: 1.3; }
  .step .calc.note-t { font-size: clamp(15px, 4.2vw, 19px); font-weight: 700; color: #e6e8f2; margin-top: 0; }
  .step .state { font-size: clamp(16px, 4.4vw, 22px); font-weight: 700; color: #cfd2e0; margin-top: 4px; line-height: 1.3; }
  .step.note { border-color: #6a4bd6; background: rgba(106,75,214,0.15); }
  .step .br { color: #8a8f9e; }
  .step .op { color: #7ad0ff; } .step .op.add { color: #7bd06a; }

  .skill-list { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 8px; padding-bottom: 10px; }
  .skill-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: #15151c; border: 2px solid #2c2c3a; border-radius: 14px; padding: 10px 12px; text-align: left; }
  .skill-row.locked { opacity: .45; }
  .skill-name { font-size: clamp(14px, 4vw, 18px); font-weight: 700; color: #fff; }
  .skill-sub { font-size: clamp(11px, 3.1vw, 13px); color: #8a8f9e; font-weight: 600; margin-top: 2px; }
  .skill-meter { display: flex; gap: 4px; flex: 0 0 auto; }
  .skill-pip { width: clamp(14px, 4vw, 20px); height: clamp(14px, 4vw, 20px); border-radius: 6px; background: #23232b; }

  .seg-btn.m-speed.active { background: #e0b020; color: #000; }
  .mode-seg { flex-wrap: wrap; justify-content: center; border-radius: 22px; }
  #reportScreen { padding-top: calc(max(env(safe-area-inset-top), 10px) + 12px); justify-content: flex-start; }
  .rep-cards { display: flex; gap: 8px; width: 100%; }
  .rep-card { flex: 1; background: #15151c; border: 2px solid #2c2c3a; border-radius: 14px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; }
  .rep-card b { font-size: clamp(20px, 6vw, 28px); color: #ffd84d; }
  .rep-card span { font-size: clamp(11px, 3.1vw, 13px); color: #8a8f9e; font-weight: 700; }
  .rep-note { font-size: clamp(13px, 3.6vw, 16px); color: #cfd2e0; font-weight: 700; text-align: center; padding: 6px 4px; }
  .rep-h { font-size: clamp(15px, 4.2vw, 19px); font-weight: 800; color: #ffd84d; margin: 8px 2px 0; text-align: left; }
  .rep-empty { font-size: 14px; color: #8a8f9e; text-align: left; padding: 0 4px; }
  .rep-r { font-size: clamp(13px, 3.6vw, 16px); color: #cfd2e0; text-align: right; margin: 0; }
</style>
</head>
<body>

<div class="topbar" id="topbar" aria-hidden="true">
  <div class="mode-seg" id="modeSeg" aria-label="choose mode">
    <button class="seg-btn m-ops" data-mode="ops">( ) Order</button>
    <button class="seg-btn m-md" data-mode="md">× ÷</button>
    <button class="seg-btn m-as" data-mode="as">+ −</button>
    <button class="seg-btn m-word" data-mode="word">📖 Words</button>
    <button class="seg-btn m-speed" data-mode="speed">⚡ Speed</button>
  </div>
  <div class="tb-scoreline">
    <span class="tb-score">⭐ <b id="scoreNum">0</b></span>
    <span class="tb-best">Best <b id="bestNum">0</b></span>
  </div>
</div>

<!-- ===== Estimation (occasional, focus-only) ===== -->
<section id="estimateScreen" class="screen">
  <div class="est-q" id="estQ"></div>
  <div class="est-sub">Just your best estimate — no need to be exact!</div>
  <div class="est-btns">
    <button class="est-btn est-more" data-side="more" id="estMore"></button>
    <button class="est-btn est-less" data-side="less" id="estLess"></button>
  </div>
  <div class="est-feedback" id="estFeedback"></div>
</section>

<!-- ===== Problem (focus-only) ===== -->
<section id="problemScreen" class="screen">
  <div class="problem-top">
    <div class="problem" id="problemText"></div>
    <div class="answer-display empty" id="answerDisplay">?</div>
    <div class="guess-hint" id="guessHint">Use scratch paper if you need it ✏️</div>
  </div>
  <div class="keypad" id="keypad">
    <button class="key" data-d="1">1</button>
    <button class="key" data-d="2">2</button>
    <button class="key" data-d="3">3</button>
    <button class="key" data-d="4">4</button>
    <button class="key" data-d="5">5</button>
    <button class="key" data-d="6">6</button>
    <button class="key" data-d="7">7</button>
    <button class="key" data-d="8">8</button>
    <button class="key" data-d="9">9</button>
    <button class="key back" data-act="back" aria-label="delete">⌫</button>
    <button class="key" data-d="0">0</button>
    <button class="key check" data-act="check">Check</button>
  </div>
</section>

<!-- ===== Celebration (between problems) ===== -->
<section id="celebrateScreen" class="screen">
  <div class="burst" id="burst"></div>
  <div class="cele-emoji" id="celeEmoji">🎉</div>
  <div class="cele-msg" id="celeMsg">You got it!</div>
  <div class="cele-sub" id="celeSub">+10 points</div>
  <div class="btn-row">
    <button class="big-btn btn-illo" id="celeIlloBtn">See the steps ✨</button>
    <button class="big-btn btn-map" id="celeMapBtn">⭐ My Stars</button>
    <button class="big-btn btn-map" id="celeRepBtn" style="display:none;">📊 Report</button>
    <button class="big-btn btn-next" id="celeNextBtn">Next ▶</button>
  </div>
</section>

<!-- ===== Teaching / worked steps (between problems) ===== -->
<section id="teachScreen" class="screen">
  <div class="teach-scroll" id="teachScroll">
    <div class="equation" id="equationText"></div>
    <div class="illo-caption" id="illoCaption" style="display:none;"></div>
    <div class="illo" id="illoArea"></div>
    <div class="illo-answer" id="illoAnswer" style="display:none;"></div>
  </div>
  <div class="btn-row">
    <button class="big-btn btn-illo" id="teachIlloBtn">Show me the steps ✨</button>
    <button class="big-btn btn-map" id="teachMapBtn">⭐ My Stars</button>
    <button class="big-btn btn-map" id="teachRepBtn" style="display:none;">📊 Report</button>
    <button class="big-btn btn-next" id="teachNextBtn">Try the next one ▶</button>
  </div>
</section>

<!-- ===== Skill map (between problems) ===== -->
<section id="mapScreen" class="screen">
  <div class="map-title" id="mapTitle">⭐ My Stars</div>
  <div class="map-tabs" id="mapTabs" aria-label="view mode">
    <button class="seg-btn m-ops" data-vm="ops">( ) Order</button>
    <button class="seg-btn m-md" data-vm="md">× ÷</button>
    <button class="seg-btn m-as" data-vm="as">+ −</button>
    <button class="seg-btn m-word" data-vm="word">📖 Words</button>
    <button class="seg-btn m-speed" data-vm="speed">⚡ Speed</button>
  </div>
  <div class="map-sub" id="mapSub"></div>
  <div class="map-scroll"><div class="skill-list" id="mapList"></div></div>
  <div class="btn-row">
    <button class="big-btn btn-map" id="mapRepBtn" style="display:none;">📊 Report</button>
    <button class="big-btn btn-next" id="mapBackBtn">◀ Back</button>
  </div>
</section>

<!-- ===== Speed report (on request) ===== -->
<section id="reportScreen" class="screen">
  <div class="map-title">📊 Speed Report</div>
  <div class="map-scroll"><div class="skill-list" id="repBody"></div></div>
  <div class="btn-row">
    <button class="big-btn btn-map" id="repCopyBtn">📋 Copy report</button>
    <button class="big-btn btn-next" id="repBackBtn">◀ Back</button>
  </div>
</section>

<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
(function () {
  "use strict";

  // ===================== State & persistence (separate per mode) =====================
  var LS_KEY = "g5_app_v1";   // { mode, ops:{best,correct,facts}, md:{...}, as:{...}, word:{...} }
  var SS_KEY = "g5_sess_v1";  // { ops:{points,sinceBonus,lastKind}, ... }
  var MODES = ["ops", "md", "as", "word", "speed"];

  function blankStore() { return { best: 0, correct: 0, facts: {}, stats: {}, log: [], total: 0 }; }
  function normStore(s) { s = s || {}; return { best: s.best || 0, correct: s.correct || 0, facts: s.facts || {},
    stats: s.stats || {}, log: s.log || [], total: s.total || 0 }; }
  function blankSess() { return { points: 0, sinceBonus: 0, lastKind: "" }; }
  function normSess(s) { s = s || {}; return { points: s.points || 0, sinceBonus: s.sinceBonus || 0, lastKind: s.lastKind || "" }; }

  function loadData() {
    var d = { mode: "ops" };
    var raw = null;
    try { raw = JSON.parse(localStorage.getItem(LS_KEY) || "null"); } catch (e) {}
    raw = raw || {};
    d.mode = (MODES.indexOf(raw.mode) >= 0) ? raw.mode : "ops";
    MODES.forEach(function (m) { d[m] = normStore(raw[m]); });
    return d;
  }
  function loadSessAll() {
    var raw = null;
    try { raw = JSON.parse(sessionStorage.getItem(SS_KEY) || "null"); } catch (e) {}
    raw = raw || {};
    var s = {};
    MODES.forEach(function (m) { s[m] = normSess(raw[m]); });
    return s;
  }
  function saveStore() { try { data.mode = mode; localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch (e) {} }
  function saveSess() { try { sessionStorage.setItem(SS_KEY, JSON.stringify(sessData)); } catch (e) {} }

  var data = loadData();
  var sessData = loadSessAll();
  var mode = data.mode;
  var store = data[mode];
  var sess = sessData[mode];

  // ===================== Small helpers =====================
  function rnd(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }
  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
  function fmt(n) { return n.toLocaleString("en-US"); }
  function money(n) { return "$" + fmt(n); }
  function hl(n) { return '<span class="hl">' + fmt(n) + '</span>'; }
  var OPNAME = { "+": "Add", "−": "Subtract", "×": "Multiply", "÷": "Divide" };
  function opSpan(o) { return '<span class="op' + ((o === "+" || o === "−") ? " add" : "") + '">' + o + '</span>'; }
  function now() { return Date.now ? Date.now() : new Date().getTime(); }

  // ===================== Expressions: parse, render, solve step-by-step =====================
  function parseExpr(s) {
    return s.split(" ").map(function (p) {
      if (p === "(" || p === "[") return { k: "open", v: p };
      if (p === ")" || p === "]") return { k: "close", v: p };
      if (p === "+" || p === "−" || p === "×" || p === "÷") return { k: "op", v: p };
      return { k: "n", v: parseInt(p, 10) };
    });
  }
  function renderTokens(t, hi) {
    var out = [];
    for (var i = 0; i < t.length; i++) {
      var x = t[i];
      if (x.k === "n") out.push(i === hi ? hl(x.v) : fmt(x.v));
      else if (x.k === "op") out.push(opSpan(x.v));
      else out.push('<span class="br">' + x.v + '</span>');
    }
    return out.join(" ");
  }
  function tokensText(t) { return t.map(function (x) { return x.k === "n" ? fmt(x.v) : x.v; }).join(" "); }

  // Applies order of operations one operation at a time. Returns null if any step is
  // not a clean positive whole number (so problems never need fractions or negatives).
  function solveSteps(tokens, limit) {
    limit = limit || 200000;
    var t = tokens.slice(), steps = [], guard = 0, i;
    while (t.length > 1 && guard++ < 60) {
      var ci = -1, oi = -1;
      for (i = 0; i < t.length; i++) if (t[i].k === "close") { ci = i; break; }
      if (ci >= 0) for (i = ci - 1; i >= 0; i--) if (t[i].k === "open") { oi = i; break; }
      var seg = (ci >= 0) ? t.slice(oi + 1, ci) : t;
      if (seg.length === 1) {
        if (ci < 0) break;
        t = t.slice(0, oi).concat(seg, t.slice(ci + 1));
        continue;
      }
      var idx = -1, high = 0, low = 0;
      for (i = 0; i < seg.length; i++) {
        if (seg[i].k !== "op") continue;
        if (seg[i].v === "×" || seg[i].v === "÷") { high++; if (idx < 0) idx = i; } else low++;
      }
      if (idx < 0) for (i = 0; i < seg.length; i++) if (seg[i].k === "op") { idx = i; break; }
      if (idx < 1 || idx > seg.length - 2) return null;
      var L = seg[idx - 1].v, R = seg[idx + 1].v, o = seg[idx].v, res;
      if (o === "+") res = L + R;
      else if (o === "−") res = L - R;
      else if (o === "×") res = L * R;
      else { if (R === 0 || L % R !== 0) return null; res = L / R; }
      if (res < 1 || res > limit) return null;

      var where = (oi >= 0) ? (t[oi].v === "(" ? "In the parentheses" : "In the brackets") : "";
      var extra = [];
      if (o === "×" || o === "÷") {
        if (low > 0) extra.push("first, before + and −");
        if (high > 1) extra.push("left to right");
      } else if (low > 1) extra.push("left to right");
      var label = (where ? where + ": " : "") + OPNAME[o] + (extra.length ? " (" + extra.join(", ") + ")" : "");

      var newSeg = seg.slice(0, idx - 1).concat([{ k: "n", v: res }], seg.slice(idx + 2));
      var hi;
      if (oi >= 0) {
        if (newSeg.length === 1) { t = t.slice(0, oi).concat(newSeg, t.slice(ci + 1)); hi = oi; }
        else { t = t.slice(0, oi + 1).concat(newSeg, t.slice(ci)); hi = oi + 1 + (idx - 1); }
      } else { t = newSeg; hi = idx - 1; }

      steps.push({
        label: label,
        calc: fmt(L) + " " + opSpan(o) + " " + fmt(R) + " = " + hl(res),
        state: (t.length > 1) ? "Now: " + renderTokens(t, hi) : ""
      });
    }
    if (t.length !== 1 || t[0].k !== "n") return null;
    return { steps: steps, value: t[0].v };
  }

  function genExpr(tpls, lo, hi, limit) {
    for (var tries = 0; tries < 900; tries++) {
      var parts = pick(tpls).split(" ");
      var s = parts.map(function (p) { return p === "n" ? String(rnd(lo, hi)) : p; }).join(" ");
      var tok = parseExpr(s), r = solveSteps(tok, limit);
      if (r) return { tokens: tok, res: r };
    }
    var tk = parseExpr("3 + 4 × 5");
    return { tokens: tk, res: solveSteps(tk) };
  }

  // ===================== Order of operations =====================
  var ORDER_TIP = "Order: ( ) first → × and ÷ left to right → + and − left to right.";
  function opsKind(key, name, unlock, tpls, lo, hi, limit) {
    return { key: key, name: name, unlock: unlock, gen: function () {
      var g = genExpr(tpls, lo, hi + Math.min(6, Math.floor(store.correct / 25)), limit);
      var txt = tokensText(g.tokens);
      return { kindClass: "expr", html: renderTokens(g.tokens), plain: txt, answer: g.res.value, steps: g.res.steps, tip: ORDER_TIP };
    } };
  }

  // ===================== Multiply / divide =====================
  function chunks(n) {
    var s = String(n), out = [];
    for (var i = 0; i < s.length; i++) { var d = +s[i]; if (d > 0) out.push(d * Math.pow(10, s.length - 1 - i)); }
    return out;
  }
  function sumChain(parts) {
    var steps = [], run = parts[0];
    for (var i = 1; i < parts.length; i++) {
      var nx = run + parts[i];
      steps.push({ label: "Add the pieces", calc: fmt(run) + " + " + fmt(parts[i]) + " = " + hl(nx) });
      run = nx;
    }
    return steps;
  }
  function mulSteps(a, b) {
    var split, other, steps = [], i;
    if (String(b).length >= String(a).length) { split = b; other = a; } else { split = a; other = b; }
    if (split < 10) {
      split = Math.max(a, b); other = Math.min(a, b);
      if (split <= 5) {
        var reps = []; for (i = 0; i < other; i++) reps.push(split);
        steps.push({ note: "Think of " + other + " groups of " + split + ":" });
        steps.push({ label: "Count them all", calc: reps.join(" + ") + " = " + hl(a * b) });
        return steps;
      }
      steps.push({ note: "Break " + split + " into 5 + " + (split - 5) + ", multiply each, then add." });
      var p1 = other * 5, p2 = other * (split - 5);
      steps.push({ label: "Multiply", calc: other + " × 5 = " + hl(p1) });
      steps.push({ label: "Multiply", calc: other + " × " + (split - 5) + " = " + hl(p2) });
      return steps.concat(sumChain([p1, p2]));
    }
    var ch = chunks(split);
    if (ch.length === 1) { steps.push({ label: "Multiply", calc: fmt(a) + " × " + fmt(b) + " = " + hl(a * b) }); return steps; }
    steps.push({ note: "Break apart " + fmt(split) + " = " + ch.map(fmt).join(" + ") + ". Multiply each piece, then add." });
    var parts = [];
    ch.forEach(function (c) {
      var p = other * c; parts.push(p);
      steps.push({ label: "Multiply", calc: fmt(other) + " × " + fmt(c) + " = " + hl(p) });
    });
    return steps.concat(sumChain(parts));
  }
  function divSteps(d, k, q) {
    var steps = [];
    if (q < 10) {
      steps.push({ note: "Think multiplication: " + k + " × ? = " + fmt(d) });
      steps.push({ label: "Find the missing factor", calc: k + " × " + hl(q) + " = " + fmt(d) });
      return steps;
    }
    var ch = chunks(q), rem = d;
    steps.push({ note: "Build the answer in friendly pieces — how many " + fmt(k) + "s fit into " + fmt(d) + "?" });
    ch.forEach(function (c) {
      var prod = k * c, nr = rem - prod;
      steps.push({
        label: "Try " + fmt(c),
        calc: fmt(k) + " × " + fmt(c) + " = " + fmt(prod),
        state: nr > 0 ? "Left over: " + fmt(rem) + " − " + fmt(prod) + " = " + fmt(nr) : "Nothing left over!"
      });
      rem = nr;
    });
    if (ch.length > 1) steps.push({ label: "Add the pieces", calc: ch.map(fmt).join(" + ") + " = " + hl(q) });
    else steps[steps.length - 1].calc = fmt(k) + " × " + hl(q) + " = " + fmt(d);
    return steps;
  }
  function mdMul(aLo, aHi, bLo, bHi) {
    return function () {
      var a = rnd(aLo, aHi), b = rnd(bLo, bHi), plain = fmt(a) + " × " + fmt(b);
      return { kindClass: plain.length > 9 ? "mid" : "", html: fmt(a) + " " + opSpan("×") + " " + fmt(b), plain: plain,
        answer: a * b, steps: mulSteps(a, b), tip: "Break a number apart by place value, multiply each piece, then add the pieces." };
    };
  }
  function mdDiv(kLo, kHi, qLo, qHi) {
    return function () {
      var k = rnd(kLo, kHi), q = rnd(qLo, qHi), d = k * q, plain = fmt(d) + " ÷ " + k;
      return { kindClass: plain.length > 9 ? "mid" : "", html: fmt(d) + " " + opSpan("÷") + " " + k, plain: plain,
        answer: q, steps: divSteps(d, k, q), tip: "Division is multiplication backwards — ask “what times " + k + " makes " + fmt(d) + "?”" };
    };
  }

  // ===================== Add / subtract =====================
  var PLACES = ["Ones", "Tens", "Hundreds", "Thousands", "Ten-thousands", "Hundred-thousands"];
  function addSteps(a, b) {
    var sa = String(a), sb = String(b), n = Math.max(sa.length, sb.length), carry = 0, steps = [];
    for (var i = 0; i < n; i++) {
      var da = +(sa[sa.length - 1 - i] || 0), db = +(sb[sb.length - 1 - i] || 0), s = da + db + carry;
      var w = s % 10, c = Math.floor(s / 10);
      steps.push({ label: PLACES[i], calc: da + " + " + db + (carry ? " + " + carry + " (carried)" : "") + " = " + s,
        state: c ? "Write " + w + ", carry " + c : "Write " + w });
      carry = c;
    }
    if (carry) steps.push({ label: PLACES[n], calc: "Bring down the carried " + carry, state: "Write " + carry });
    steps.push({ label: "Put it together", calc: fmt(a) + " + " + fmt(b) + " = " + hl(a + b) });
    return steps;
  }
  function subSteps(a, b) {
    var sa = String(a), sb = String(b), n = sa.length, borrow = 0, steps = [];
    for (var i = 0; i < n; i++) {
      var da = +sa[n - 1 - i], db = +(sb[sb.length - 1 - i] || 0);
      var base = da - borrow, need = base < db, top = need ? base + 10 : base, w = top - db;
      var note = "";
      if (borrow) note += (base < 0 ? da + " gave 1 away, so it needs to borrow too. " : da + " gave 1 away, so it is " + base + ". ");
      note += "Write " + w;
      steps.push({ label: PLACES[i], calc: (need ? "Borrow: " : "") + top + " − " + db + " = " + w, state: note });
      borrow = need ? 1 : 0;
    }
    steps.push({ label: "Put it together", calc: fmt(a) + " − " + fmt(b) + " = " + hl(a - b) });
    return steps;
  }
  function asGen(d, isAdd) {
    return function () {
      var lo = Math.pow(10, d - 1), hi = Math.pow(10, d) - 1, a = rnd(lo, hi), b = rnd(lo, hi), guard = 0;
      if (!isAdd) { while (a <= b && guard++ < 50) { a = rnd(lo, hi); b = rnd(lo, hi); } if (a <= b) { a = hi; b = lo; } }
      var sym = isAdd ? "+" : "−", plain = fmt(a) + " " + sym + " " + fmt(b);
      return { kindClass: plain.length > 9 ? "mid" : "", html: fmt(a) + " " + opSpan(sym) + " " + fmt(b), plain: plain,
        answer: isAdd ? a + b : a - b, steps: isAdd ? addSteps(a, b) : subSteps(a, b),
        tip: isAdd ? "Line up the places. Add from the ones, and carry when a place reaches 10." : "Line up the places. Subtract from the ones, and borrow when the top digit is too small." };
    };
  }

  // ===================== Word problems =====================
  var NAMES = ["Maya", "Jordan", "Leo", "Sofia", "Ethan", "Priya", "Marcus", "Lily", "Noah", "Zoe", "Aiden", "Nina", "Omar", "Chloe"];
  function nm() { return pick(NAMES); }
  function wLvl() { var c = store.correct; return c < 12 ? 0 : (c < 30 ? 1 : 2); }
  function hiNums(t) { return t.replace(/(\$?\d[\d,]*)/g, '<span class="num">$1</span>'); }

  function wp(text, expr, unit, isMoney, clue) {
    var tok = parseExpr(expr), r = solveSteps(tok);
    if (!r) return null;
    var steps = [{ note: "💡 " + clue }];
    if (tok.length > 3) steps.push({ label: "Write the equation", calc: renderTokens(tok) });
    steps = steps.concat(r.steps);
    return { kindClass: "word", html: hiNums(text), textHtml: hiNums(text), plain: text, answer: r.value,
      ansText: isMoney ? money(r.value) : fmt(r.value) + (unit ? " " + unit : ""),
      steps: steps, tip: "Read it, decide what the question asks, write an equation, then solve." };
  }
  function retry(fn) {
    return function () {
      for (var i = 0; i < 100; i++) { var p = fn(); if (p) return p; }
      return wp("What is 12 + 13?", "12 + 13", "", false, "Put the amounts together — add.");
    };
  }

  var wAdd = retry(function () {
    var r = [[20, 99], [100, 999], [1000, 9999]][wLvl()], a = rnd(r[0], r[1]), b = rnd(r[0], r[1]), N = nm();
    var t = pick([
      { t: N + " read " + fmt(a) + " pages on Saturday and " + fmt(b) + " pages on Sunday. How many pages did " + N + " read in all?", u: "pages" },
      { t: "A school collected " + fmt(a) + " cans in the fall and " + fmt(b) + " cans in the spring. How many cans did the school collect altogether?", u: "cans" },
      { t: "A bakery sold " + fmt(a) + " muffins before noon and " + fmt(b) + " muffins after noon. How many muffins did it sell in total?", u: "muffins" },
      { t: "A zoo had " + fmt(a) + " visitors on Friday and " + fmt(b) + " visitors on Saturday. How many visitors came in all?", u: "visitors" }
    ]);
    return wp(t.t, a + " + " + b, t.u, false, "“In all,” “altogether,” and “total” mean put the groups together — add.");
  });
  var wSub = retry(function () {
    var L = wLvl(), a, b, N = nm();
    if (L === 0) { a = rnd(50, 99); b = rnd(11, a - 5); }
    else if (L === 1) { a = rnd(300, 999); b = rnd(100, a - 20); }
    else { a = rnd(3000, 9999); b = rnd(1000, a - 100); }
    var t = pick([
      { t: N + " had " + fmt(a) + " stickers and gave " + fmt(b) + " to a friend. How many stickers does " + N + " have left?", u: "stickers" },
      { t: "A stadium has " + fmt(a) + " seats. If " + fmt(b) + " seats are taken, how many seats are empty?", u: "seats" },
      { t: "A hiking trail is " + fmt(a) + " feet long. " + N + " has walked " + fmt(b) + " feet. How many more feet are left to walk?", u: "feet" },
      { t: "A store had " + fmt(a) + " bottles of juice and sold " + fmt(b) + ". How many bottles are left?", u: "bottles" }
    ]);
    return wp(t.t, a + " − " + b, t.u, false, "“Left,” “how many more,” and “difference” mean take away — subtract.");
  });
  var wMul = retry(function () {
    var L = wLvl(), a, b, N = nm();
    if (L === 0) { a = rnd(3, 12); b = rnd(3, 12); }
    else if (L === 1) { a = rnd(12, 30); b = rnd(3, 12); }
    else { a = rnd(12, 45); b = rnd(12, 45); }
    var t = pick([
      { t: "There are " + a + " rows of seats in a theater. Each row has " + b + " seats. How many seats are there?", u: "seats", m: false },
      { t: N + " bought " + a + " packs of trading cards. Each pack has " + b + " cards. How many cards did " + N + " buy?", u: "cards", m: false },
      { t: "Movie tickets cost " + money(b) + " each. How much do " + a + " tickets cost?", u: "", m: true },
      { t: "A garden has " + a + " rows of tomato plants with " + b + " plants in each row. How many plants are in the garden?", u: "plants", m: false }
    ]);
    return wp(t.t, a + " × " + b, t.u, t.m, "Equal groups — a number of groups with the same amount in each — means multiply.");
  });
  var wDiv = retry(function () {
    var L = wLvl(), k, q, N = nm();
    if (L === 0) { k = rnd(3, 9); q = rnd(3, 12); }
    else if (L === 1) { k = rnd(3, 12); q = rnd(12, 60); }
    else { k = rnd(11, 30); q = rnd(12, 60); }
    var t = k * q;
    var T = pick([
      { t: N + " has " + fmt(t) + " stickers to share equally among " + k + " friends. How many stickers does each friend get?", u: "stickers" },
      { t: fmt(t) + " students are going on a field trip. Each bus holds " + k + " students. How many buses are needed?", u: "buses" },
      { t: "A ribbon is " + fmt(t) + " inches long. " + N + " cuts it into pieces that are each " + k + " inches long. How many pieces is that?", u: "pieces" },
      { t: "A baker packs " + fmt(t) + " cookies into boxes of " + k + ". How many boxes does the baker fill?", u: "boxes" }
    ]);
    return wp(T.t, t + " ÷ " + k, T.u, false, "“Share equally” or “how many groups” with a total to split up means divide.");
  });
  var wTwo = retry(function () {
    var L = wLvl(), N = nm(), which = rnd(1, 5), a, b, c, p, m, k, q, s, t;
    var clue = "Two steps — do one calculation first, then use that answer in the next one.";
    if (which === 1) {
      a = rnd(3, L ? 12 : 8); p = rnd(2, L ? 15 : 9);
      var bills = [10, 20, 50, 100, 200, 500]; m = 0;
      for (var i = 0; i < bills.length; i++) if (bills[i] > a * p) { m = bills[i]; break; }
      return wp(N + " buys " + a + " notebooks for " + money(p) + " each and pays with a " + money(m) + " bill. How much change does " + N + " get back?",
        m + " − " + a + " × " + p, "", true, clue);
    }
    if (which === 2) {
      a = rnd(6, L ? 24 : 12); b = rnd(3, L ? 12 : 9); c = rnd(2, a - 1);
      return wp("A box holds " + a + " crayons. " + N + " has " + b + " full boxes and " + c + " extra crayons. How many crayons does " + N + " have?",
        b + " × " + a + " + " + c, "crayons", false, clue);
    }
    if (which === 3) {
      a = rnd(5, L ? 30 : 20); b = rnd(3, 9); c = rnd(10, 40);
      return wp(N + " reads " + a + " pages each day for " + b + " days, then reads " + c + " more pages. How many pages did " + N + " read in all?",
        a + " × " + b + " + " + c, "pages", false, clue);
    }
    if (which === 4) {
      k = 12; q = rnd(5, L ? 40 : 25); s = rnd(2, q - 1); t = k * q;
      return wp("A farmer packs " + fmt(t) + " eggs into cartons of " + k + ". If " + s + " cartons are sold, how many cartons are left?",
        t + " ÷ " + k + " − " + s, "cartons", false, clue);
    }
    a = rnd(5, L ? 30 : 20); b = rnd(3, 12); c = rnd(5, Math.max(6, a * b - 5));
    return wp(N + " saves " + money(a) + " each week for " + b + " weeks and then spends " + money(c) + " on a game. How much money does " + N + " have left?",
      a + " × " + b + " − " + c, "", true, clue);
  });
  var wOps = retry(function () {
    var N = nm(), which = rnd(1, 5), a, b, c, d, p, q, k, s, total;
    var clue = "Write ONE expression for the whole story, then use the order of operations.";
    if (which === 1) {
      a = rnd(3, 15); b = rnd(3, 15); p = rnd(2, 9);
      return wp(N + " bought " + a + " red pens and " + b + " blue pens. Each pen cost " + money(p) + ". How much did " + N + " spend in all?",
        "( " + a + " + " + b + " ) × " + p, "", true, "Add the pens first — that is what the parentheses are for.");
    }
    if (which === 2) {
      k = rnd(4, 12); q = rnd(3, 15); total = k * q; a = rnd(5, total - 3); b = total - a;

      var left = document.createElement("div");

      var sub = document.createElement("div"); sub.className = "skill-sub";
      sub.textContent = n ? Math.round(100 * c / n) + "% right · avg " + (c ? secs(cms / c) : "–") + " · " + n + " answers" : "Not tried yet";
      left.appendChild(nm1); left.appendChild(sub);
      var meter = document.createElement("div"); meter.className = "skill-meter";
      for (var i = 0; i < 5; i++) {
        var pip = document.createElement("span"); pip.className = "skill-pip";
        if (i < filled) pip.style.background = palette[Math.min(5, 1 + i)];
        meter.appendChild(pip);
      }
      row.appendChild(left); row.appendChild(meter); list.appendChild(row);
    }
    document.getElementById("mapSub").textContent = mastered + (mastered === 1 ? " table" : " tables") + " mastered (right + under 2.5s)! ⚡";
  }
  function renderMap() {
    var tabs0 = document.querySelectorAll("#mapTabs .seg-btn");
    if (mapView === "speed") {
      renderSpeedMap();
      for (var q = 0; q < tabs0.length; q++) tabs0[q].classList.toggle("active", tabs0[q].getAttribute("data-vm") === mapView);
      return;
    }
    var vstore = data[mapView], kinds = MODE_KINDS[mapView];
    var list = document.getElementById("mapList"); list.innerHTML = "";
    var palette = ["#4a3a5a", "#6a4bd6", "#4f7fd0", "#3fa45c", "#7bd06a", "#ffd84d"];
    var mastered = 0;
    kinds.forEach(function (k) {
      var f = vstore.facts[k.key], locked = vstore.correct < k.unlock;
      if (f && f.box >= 4) mastered++;
      var row = document.createElement("div"); row.className = "skill-row" + (locked ? " locked" : "");
      var left = document.createElement("div");
      var nm1 = document.createElement("div"); nm1.className = "skill-name"; nm1.textContent = (locked ? "🔒 " : "") + k.name;
      var sub = document.createElement("div"); sub.className = "skill-sub";
      sub.textContent = locked ? "Unlocks after " + k.unlock + " correct answers" : (f ? f.correct + " right · " + f.wrong + " to practice" : "Not tried yet");
      left.appendChild(nm1); left.appendChild(sub);
      var meter = document.createElement("div"); meter.className = "skill-meter";
      var filled = f ? Math.max(1, f.box) : 0;
      for (var i = 0; i < 5; i++) {
        var pip = document.createElement("span"); pip.className = "skill-pip";
        if (i < filled) pip.style.background = palette[Math.min(f.box, 5)];
        meter.appendChild(pip);
      }
      row.appendChild(left); row.appendChild(meter); list.appendChild(row);
    });
    document.getElementById("mapSub").textContent = mastered + (mastered === 1 ? " skill" : " skills") + " mastered! Keep going ⭐";
    var tabs = document.querySelectorAll("#mapTabs .seg-btn");
    for (var j = 0; j < tabs.length; j++) tabs[j].classList.toggle("active", tabs[j].getAttribute("data-vm") === mapView);
  }


  // ===================== Speed report (on request) =====================
  function pairStats() {
    var out = [];
    for (var key in store.stats) {
      var s = store.stats[key], ab = key.split("×");
      out.push({ a: +ab[0], b: +ab[1], key: key, s: s, avg: s.c ? s.cms / s.c : null, acc: s.c / s.n });
    }
    return out;
  }
  function buildReport() {
    var ps = pairStats(), R = { total: store.total, correct: 0, ms: 0, tiers: [0, 0, 0, 0, 0], points: 0 };
    store.log.forEach(function (e) {
      if (e[2]) { R.correct++; R.ms += e[3]; var pt = speedPoints(e[3]); R.points += pt; R.tiers[pt === 10 ? 0 : pt === 8 ? 1 : pt === 5 ? 2 : pt === 3 ? 3 : 4]++; }
    });
    R.logN = store.log.length;
    R.weak = ps.filter(function (p) { return p.s.n >= 2; })
      .map(function (p) { return { p: p, w: pairWeight(p.a, p.b) }; })
      .sort(function (x, y) { return y.w - x.w; }).slice(0, 6).map(function (x) { return x.p; });
    R.slow = ps.filter(function (p) { return p.s.c >= 2; }).sort(function (x, y) { return y.avg - x.avg; }).slice(0, 5);
    R.tables = [];
    for (var t = SPEED_LO; t <= SPEED_HI; t++) {
      var n = 0, c = 0, cms = 0;
      ps.forEach(function (p) { if (p.a === t || p.b === t) { n += p.s.n; c += p.s.c; cms += p.s.cms; } });
      R.tables.push({ t: t, n: n, acc: n ? c / n : null, avg: c ? cms / c : null });
    }
    R.order = [];
    ps.forEach(function (p) {
      if (p.a >= p.b || p.avg == null || p.s.c < 2) return;
      var q = store.stats[p.b + "×" + p.a];
      if (!q || q.c < 2) return;
      var qa = q.cms / q.c, d = p.avg - qa;
      if (Math.abs(d) >= 800) R.order.push({ slowK: d > 0 ? p.key : p.b + "×" + p.a, fastK: d > 0 ? p.b + "×" + p.a : p.key, d: Math.abs(d) });
    });
    R.order.sort(function (x, y) { return y.d - x.d; }); R.order = R.order.slice(0, 3);
    R.adapting = store.total >= SPEED_MIN_SAMPLE;
    return R;
  }
  function pairLine(p) {
    return p.a + " × " + p.b + " — " + Math.round(100 * p.acc) + "% right" + (p.avg != null ? ", avg " + secs(p.avg) : "") + " (" + p.s.n + " tries)";
  }
  function reportText() {
    var R = buildReport(), L = [];
    L.push("SPEED REPORT — times tables");
    L.push("Answers: " + R.total + " | Correct: " + R.correct + " (" + (R.total ? Math.round(100 * R.correct / R.total) : 0) + "%) | Avg speed when right: " + (R.correct ? secs(R.ms / R.correct) : "–"));
    L.push("Speed tiers (correct answers): ≤1s " + R.tiers[0] + " · ≤2s " + R.tiers[1] + " · ≤3s " + R.tiers[2] + " · ≤4s " + R.tiers[3] + " · slower " + R.tiers[4]);
    L.push(R.adapting ? "Practice is now adapting to weak/slow facts." : "Still collecting data (" + R.total + "/" + SPEED_MIN_SAMPLE + " answers) before adapting.");
    L.push(""); L.push("Needs the most work:"); R.weak.forEach(function (p) { L.push("  " + pairLine(p)); });
    L.push(""); L.push("Slowest (when correct):"); R.slow.forEach(function (p) { L.push("  " + pairLine(p)); });
    L.push(""); L.push("By table:"); R.tables.forEach(function (x) { L.push("  ×" + x.t + ": " + (x.n ? Math.round(100 * x.acc) + "% right, avg " + (x.avg != null ? secs(x.avg) : "–") + " (" + x.n + ")" : "no data")); });
    if (R.order.length) { L.push(""); L.push("Order matters:"); R.order.forEach(function (o) { L.push("  " + o.slowK.replace("×", " × ") + " is " + secs(o.d) + " slower than " + o.fastK.replace("×", " × ")); }); }
    return L.join("\n");
  }
  function renderReport() {
    var R = buildReport(), el = document.getElementById("repBody");
    function sec(title, rows) { return '<div class="rep-h">' + title + '</div>' + (rows.length ? rows.join("") : '<div class="rep-empty">Not enough data yet</div>'); }
    function row(l, r) { return '<div class="skill-row"><div class="skill-name">' + l + '</div><div class="skill-sub rep-r">' + r + '</div></div>'; }
    var h = '';
    h += '<div class="rep-cards">' +
      '<div class="rep-card"><b>' + R.total + '</b><span>answers</span></div>' +
      '<div class="rep-card"><b>' + (R.total ? Math.round(100 * R.correct / R.total) : 0) + '%</b><span>correct</span></div>' +
      '<div class="rep-card"><b>' + (R.correct ? secs(R.ms / R.correct) : "–") + '</b><span>avg speed</span></div></div>';
    h += '<div class="rep-note">' + (R.adapting ? "🎯 Practice is now adapting to the facts that need work." : "📊 Collecting data: " + R.total + "/" + SPEED_MIN_SAMPLE + " answers before problems adapt.") + '</div>';
    h += sec("⚡ Speed tiers", [row("≤ 1 sec · 10 pts", R.tiers[0]), row("≤ 2 sec · 8 pts", R.tiers[1]), row("≤ 3 sec · 5 pts", R.tiers[2]), row("≤ 4 sec · 3 pts", R.tiers[3]), row("slower · 1 pt", R.tiers[4])]);
    h += sec("🎯 Needs the most work", R.weak.map(function (p) { return row(p.a + " × " + p.b, Math.round(100 * p.acc) + "% · " + (p.avg != null ? secs(p.avg) : "–") + " · " + p.s.n + "x"); }));
    h += sec("🐢 Slowest when correct", R.slow.map(function (p) { return row(p.a + " × " + p.b, secs(p.avg) + " avg · " + p.s.c + "x"); }));
    h += sec("📚 By table", R.tables.map(function (x) { return row("× " + x.t, x.n ? Math.round(100 * x.acc) + "% · " + (x.avg != null ? secs(x.avg) : "–") + " · " + x.n + "x" : "no data"); }));
    if (R.order.length) h += sec("🔀 Order matters", R.order.map(function (o) { return row(o.slowK.replace("×", " × "), secs(o.d) + " slower than " + o.fastK.replace("×", " × ")); }));
    el.innerHTML = h;
  }

  // ===================== Confetti =====================
  var confettiEl = document.getElementById("confetti");
  var confettiNormal = ["🎉", "⭐", "🌈", "💖", "✨", "🎈", "🚀"];
  var confettiGold = ["🌟", "⭐", "🏆", "✨", "💛", "🎉", "👑"];
  function launchConfetti(bonus) {
    confettiEl.innerHTML = "";
    var bits = bonus ? confettiGold : confettiNormal;
    var count = bonus ? 44 : 28;
    for (var i = 0; i < count; i++) {
      var s = document.createElement("span");
      s.textContent = pick(bits);
      s.style.left = Math.random() * 100 + "vw";
      s.style.animationDuration = (2.0 + Math.random() * 1.9) + "s";
      s.style.animationDelay = (Math.random() * 0.5) + "s";
      s.style.fontSize = (bonus ? (24 + Math.random() * 18) : (20 + Math.random() * 14)) + "px";
      confettiEl.appendChild(s);
    }
    setTimeout(function () { confettiEl.innerHTML = ""; }, 4800);
  }

  // ===================== Gentle chime (WebAudio, no asset files) =====================
  var audioCtx = null;
  function chime(bonus) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      var notes = bonus ? [523.25, 659.25, 783.99, 1046.5, 1318.5] : [523.25, 659.25, 783.99];
      notes.forEach(function (f, idx) {
        var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = "sine"; osc.frequency.value = f;
        var t0 = audioCtx.currentTime + idx * 0.1;
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(0.18, t0 + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.42);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t0); osc.stop(t0 + 0.5);
      });
    } catch (e) {}
  }

  // Test hook (only present when a test harness defines window.__G5_TEST first)
  if (typeof window !== "undefined" && window.__G5_TEST) {
    window.__G5_TEST.kinds = MODE_KINDS;
    window.__G5_TEST.setCorrect = function (m, n) { data[m].correct = n; };
    window.__G5_TEST.use = function (m) { mode = m; store = data[m]; sess = sessData[m]; };
    window.__G5_TEST.speed = { gen: speedGen, rec: recordSpeed, pts: speedPoints, report: reportText, build: buildReport, weight: pairWeight, store: function () { return data.speed; } };
    window.__G5_TEST.solve = function (s) { return solveSteps(parseExpr(s)); };
  }

  // ===================== Init =====================
  updateModeUI();
  updateScore();
  newProblem();
  startProblemFlow();
})();
</script>
