<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>Avery's Math</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✖️</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✖️</text></svg>">
<style>
  :root { --gap: clamp(10px, 3vw, 18px); --hdr: 92px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  body { overflow: hidden; }

  .screen {
    position: fixed; inset: 0;
    display: none; flex-direction: column; align-items: center;
    padding: max(env(safe-area-inset-top), 12px) 14px max(env(safe-area-inset-bottom), 14px);
  }
  .screen.active { display: flex; }

  /* Top bar (mode toggle + score) — only on BETWEEN-problem screens, never during a question */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: max(env(safe-area-inset-top), 10px) 10px 8px;
    display: none; flex-direction: column; align-items: center; justify-content: flex-start; gap: 6px;
    z-index: 60; font-weight: 800; pointer-events: none;
    background: linear-gradient(#000 80%, rgba(0,0,0,0));
  }
  .topbar.show { display: flex; }
  .mode-seg, .map-tabs {
    display: flex; gap: 6px; pointer-events: auto;
    background: #15151c; border: 2px solid #2c2c3a; border-radius: 999px; padding: 4px;
  }
  .map-tabs { margin: 8px 0 2px; }
  .seg-btn {
    appearance: none; border: none; background: transparent; color: #9aa0b5;
    font-weight: 800; font-size: clamp(14px, 4vw, 18px); padding: 8px 16px;
    border-radius: 999px; cursor: pointer; touch-action: manipulation; transition: background .12s ease, color .12s ease;
  }
  .seg-btn.active { background: #6a4bd6; color: #fff; }
  .seg-btn.add.active { background: #2bb673; color: #fff; }
  .tb-scoreline { display: flex; align-items: center; gap: 16px; }
  .tb-score { font-size: clamp(17px, 4.6vw, 22px); }
  .tb-score b { color: #ffd84d; }
  .tb-best { font-size: clamp(13px, 3.8vw, 17px); color: #9aa0b5; }
  .tb-best b { color: #cfd2e0; }
  /* Between-problem screens leave room for the bar */
  #celebrateScreen, #teachScreen { padding-top: calc(max(env(safe-area-inset-top), 10px) + var(--hdr)); }
  #mapScreen { padding-top: calc(max(env(safe-area-inset-top), 10px) + 12px); }

  /* ---------- Problem screen (focus-only) ---------- */
  #problemScreen { justify-content: space-between; }
  .problem-top {
    flex: 1 1 auto; width: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 0;
  }
  .problem { font-size: clamp(56px, 17vw, 130px); font-weight: 800; letter-spacing: 2px; line-height: 1.1; text-align: center; }
  .problem .x { color: #7ad0ff; margin: 0 0.12em; }
  .problem .op { color: #7ad0ff; margin: 0 0.12em; }
  .problem .op.add { color: #7bd06a; }
  .answer-display {
    margin-top: clamp(14px, 4vw, 28px); min-height: 1.3em;
    font-size: clamp(40px, 12vw, 84px); font-weight: 800; color: #ffd84d;
    border-bottom: 4px solid #33333f; min-width: 2.2em; text-align: center; padding: 0 0.2em 4px;
  }
  .answer-display.empty { color: #555; }
  .guess-hint { font-size: clamp(14px, 4vw, 18px); color: #8a8f9e; margin-top: 12px; font-weight: 600; }

  /* Keypad */
  .keypad { flex: 0 0 auto; width: 100%; max-width: 480px; display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap); margin-top: var(--gap); }
  .key {
    appearance: none; border: none; background: #1c1c26; color: #fff;
    font-size: clamp(28px, 8vw, 40px); font-weight: 700; border-radius: 18px;
    padding: clamp(14px, 4.5vw, 26px) 0; cursor: pointer;
    transition: transform .06s ease, background .12s ease; touch-action: manipulation;
  }
  .key:active { transform: scale(0.94); background: #2a2a3a; }
  .key.back { background: #2a2230; color: #ffb3c7; }
  .key.check { background: #2bb673; color: #fff; font-weight: 800; font-size: clamp(22px, 6.5vw, 32px); }
  .key.check:active { background: #229c61; }

  /* ---------- Estimation screen (focus-only) ---------- */
  #estimateScreen { justify-content: center; text-align: center; }
  .est-q { font-size: clamp(26px, 7.5vw, 44px); font-weight: 800; margin: 0 14px 10px; line-height: 1.15; }
  .est-q .x { color: #7ad0ff; } .est-q .t { color: #ffd84d; }
  .est-sub { font-size: clamp(16px, 4.5vw, 20px); color: #cfd2e0; margin-bottom: 26px; font-weight: 600; }
  .est-btns { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 14px; }
  .est-btn { appearance: none; border: none; border-radius: 20px; padding: clamp(20px, 6vw, 32px); font-size: clamp(22px, 6.5vw, 30px); font-weight: 800; color: #fff; cursor: pointer; touch-action: manipulation; transition: transform .06s ease; }
  .est-btn:active { transform: scale(0.97); }
  .est-more { background: #3f7fd6; } .est-less { background: #d6743f; }
  .est-feedback { min-height: 1.5em; margin-top: 20px; font-size: clamp(18px, 5vw, 24px); font-weight: 800; color: #7bd06a; }

  /* ---------- Celebration screen ---------- */
  #celebrateScreen { justify-content: center; text-align: center; }
  .burst {
    position: absolute; top: 50%; left: 50%; width: min(125vw, 560px); height: min(125vw, 560px);
    transform: translate(-50%, -56%) scale(.2); border-radius: 50%; pointer-events: none; opacity: 0; z-index: 0;
    background: repeating-conic-gradient(from 0deg, rgba(255,216,77,.18) 0deg, rgba(255,216,77,0) 7deg, rgba(255,216,77,0) 14deg);
  }
  .burst.gold { background: repeating-conic-gradient(from 0deg, rgba(255,196,0,.36) 0deg, rgba(255,120,0,0) 6deg, rgba(255,196,0,0) 12deg); }
  .burst.go { animation: burst 1.1s ease-out; }
  @keyframes burst {
    0% { opacity: 0; transform: translate(-50%,-56%) scale(.2) rotate(0deg); }
    25% { opacity: .95; }
    100% { opacity: 0; transform: translate(-50%,-56%) scale(1.15) rotate(45deg); }
  }
  .cele-emoji { position: relative; z-index: 1; font-size: clamp(80px, 26vw, 170px); animation: pop 0.6s ease, wiggle 1.6s ease-in-out infinite 0.6s; }
  .cele-msg { position: relative; z-index: 1; font-size: clamp(30px, 8.5vw, 50px); font-weight: 800; margin: 18px 14px 6px; color: #fff; }
  .cele-msg.bonus { color: #ffd84d; text-shadow: 0 0 18px rgba(255,216,77,.5); }
  .cele-sub { position: relative; z-index: 1; font-size: clamp(18px, 5vw, 26px); font-weight: 700; color: #ffd84d; margin-bottom: 26px; }
  @keyframes pop { 0% { transform: scale(0);} 70% { transform: scale(1.25);} 100% { transform: scale(1);} }
  @keyframes wiggle { 0%,100% { transform: translateY(0) rotate(-4deg);} 50% { transform: translateY(-14px) rotate(4deg);} }

  /* Confetti */
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .confetti span { position: absolute; top: -10%; font-size: clamp(22px, 6vw, 34px); animation: fall linear forwards; }
  @keyframes fall { 0% { transform: translateY(-12vh) rotate(0deg);} 100% { transform: translateY(112vh) rotate(560deg);} }

  /* ---------- Teaching screen ---------- */
  #teachScreen { justify-content: flex-start; }
  .teach-scroll { width: 100%; flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; align-items: center; }
  .equation { font-size: clamp(40px, 12vw, 84px); font-weight: 800; text-align: center; margin-top: clamp(6px, 2vw, 16px); }
  .equation .x { color: #7ad0ff; } .equation .eq { color: #2bb673; } .equation .prod { color: #ffd84d; }
  .equation .op { color: #7ad0ff; } .equation .op.add { color: #7bd06a; }

  .illo-caption { font-size: clamp(18px, 5.2vw, 27px); font-weight: 800; text-align: center; margin: 16px 10px 6px; color: #fff; line-height: 1.25; }
  .illo-caption .hl { color: #ffd84d; }
  .illo-answer { font-size: clamp(18px, 5vw, 26px); font-weight: 800; text-align: center; margin: 8px 12px 4px; color: #fff; }
  .illo-answer .hl { color: #ffd84d; }
  .illo { width: 100%; max-width: 640px; display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: clamp(8px, 2.5vw, 16px); padding: 8px 4px 12px; }
  .group-box { background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.12); border-radius: 18px; padding: clamp(6px, 2vw, 12px); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .group-label { font-size: clamp(20px, 6vw, 32px); line-height: 1; }
  .group-items { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(2px, 1.2vw, 6px); max-width: 6.2em; }
  .obj { font-size: clamp(18px, 5.5vw, 30px); line-height: 1; animation: pop 0.4s ease backwards; }
  .empty-note { font-size: clamp(13px, 3.6vw, 17px); color: #9aa0b5; font-weight: 700; }
  .svg-group { width: clamp(108px, 29vw, 156px); height: clamp(108px, 29vw, 156px); }

  /* Grid / array (area-model) view */
  .grid { display: inline-grid; gap: clamp(3px, 1.4vw, 7px); padding: 8px; }
  .dot { width: clamp(13px, 4.6vw, 24px); height: clamp(13px, 4.6vw, 24px); border-radius: 50%; animation: pop 0.35s ease backwards; }

  /* Addition "combine into one pile" view */
  .pile { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: clamp(4px, 1.8vw, 9px); max-width: 560px; padding: 12px; background: rgba(255,255,255,0.05); border: 2px solid rgba(255,255,255,0.12); border-radius: 22px; }
  .add-item { width: clamp(26px, 8vw, 40px); height: clamp(26px, 8vw, 40px); animation: pop 0.35s ease backwards; }
  .plus-chip { font-size: clamp(24px, 7vw, 36px); font-weight: 800; color: #ffd84d; margin: 0 6px; }

  /* ---------- Mastery map screen ---------- */
  #mapScreen { justify-content: flex-start; }
  .map-title { font-size: clamp(26px, 7vw, 38px); font-weight: 800; margin-top: 4px; }
  .map-sub { font-size: clamp(15px, 4vw, 19px); color: #ffd84d; font-weight: 700; margin: 6px 0 12px; }
  .map-scroll { flex: 1 1 auto; width: 100%; overflow: auto; display: flex; justify-content: center; }
  .map-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; width: 100%; max-width: 440px; align-content: start; }
  .map-cell { aspect-ratio: 1 / 1; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: clamp(9px, 2.6vw, 13px); font-weight: 700; color: rgba(255,255,255,0.9); }

  /* Buttons */
  .big-btn { appearance: none; border: none; width: 100%; max-width: 480px; border-radius: 20px; padding: clamp(16px, 5vw, 24px) 18px; font-size: clamp(20px, 6vw, 28px); font-weight: 800; cursor: pointer; touch-action: manipulation; transition: transform .06s ease, background .12s ease; }
  .big-btn:active { transform: scale(0.97); }
  .btn-illo { background: #6a4bd6; color: #fff; }
  .btn-illo:active { background: #5a3fc0; }
  .btn-next { background: #2bb673; color: #fff; }
  .btn-next:active { background: #229c61; }
  .btn-map { background: #2a2a3a; color: #ffd84d; font-size: clamp(16px, 4.6vw, 20px); padding: clamp(11px, 3.4vw, 15px) 18px; }
  .btn-row { flex: 0 0 auto; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; padding-top: 10px; }
</style>
</head>
<body>

<div class="topbar" id="topbar" aria-hidden="true">
  <div class="mode-seg" aria-label="choose mode">
    <button class="seg-btn" id="segMul" data-mode="multiply">✖️ Multiply</button>
    <button class="seg-btn add" id="segAdd" data-mode="add">➕ Add</button>
  </div>
  <div class="tb-scoreline">
    <span class="tb-score">⭐ <b id="scoreNum">0</b></span>
    <span class="tb-best">Best <b id="bestNum">0</b></span>
  </div>
</div>

<!-- ===== Estimation (occasional, focus-only) ===== -->
<section id="estimateScreen" class="screen">
  <div class="est-q" id="estQ"></div>
  <div class="est-sub">Just your best feel — no need to be exact!</div>
  <div class="est-btns">
    <button class="est-btn est-more" data-side="more" id="estMore"></button>
    <button class="est-btn est-less" data-side="less" id="estLess"></button>
  </div>
  <div class="est-feedback" id="estFeedback"></div>
</section>

<!-- ===== Problem (focus-only) ===== -->
<section id="problemScreen" class="screen">
  <div class="problem-top">
    <div class="problem" id="problemText"></div>
    <div class="answer-display empty" id="answerDisplay">?</div>
    <div class="guess-hint">Take your best guess! ✏️</div>
  </div>
  <div class="keypad" id="keypad">
    <button class="key" data-d="1">1</button>
    <button class="key" data-d="2">2</button>
    <button class="key" data-d="3">3</button>
    <button class="key" data-d="4">4</button>
    <button class="key" data-d="5">5</button>
    <button class="key" data-d="6">6</button>
    <button class="key" data-d="7">7</button>
    <button class="key" data-d="8">8</button>
    <button class="key" data-d="9">9</button>
    <button class="key back" data-act="back" aria-label="delete">⌫</button>
    <button class="key" data-d="0">0</button>
    <button class="key check" data-act="check">Check</button>
  </div>
</section>

<!-- ===== Celebration (between problems) ===== -->
<section id="celebrateScreen" class="screen">
  <div class="burst" id="burst"></div>
  <div class="cele-emoji" id="celeEmoji">🎉</div>
  <div class="cele-msg" id="celeMsg">You got it, Avery!</div>
  <div class="cele-sub" id="celeSub">+10 points</div>
  <div class="btn-row">
    <button class="big-btn btn-illo" id="celeIlloBtn">See the picture ✨</button>
    <button class="big-btn btn-map" id="celeMapBtn">⭐ My Stars</button>
    <button class="big-btn btn-next" id="celeNextBtn">Next ▶</button>
  </div>
</section>

<!-- ===== Teaching / illustration (between problems) ===== -->
<section id="teachScreen" class="screen">
  <div class="teach-scroll" id="teachScroll">
    <div class="equation" id="equationText"></div>
    <div class="illo-caption" id="illoCaption" style="display:none;"></div>
    <div class="illo" id="illoArea"></div>
    <div class="illo-answer" id="illoAnswer" style="display:none;"></div>
  </div>
  <div class="btn-row">
    <button class="big-btn btn-illo" id="teachIlloBtn">Show me the picture ✨</button>
    <button class="big-btn btn-map" id="teachMapBtn">⭐ My Stars</button>
    <button class="big-btn btn-next" id="teachNextBtn">Try the next one ▶</button>
  </div>
</section>

<!-- ===== Mastery map (between problems) ===== -->
<section id="mapScreen" class="screen">
  <div class="map-title" id="mapTitle">⭐ My Stars</div>
  <div class="map-tabs" aria-label="view mode">
    <button class="seg-btn" id="mapTabMul" data-vm="multiply">✖️ Multiply</button>
    <button class="seg-btn add" id="mapTabAdd" data-vm="add">➕ Add</button>
  </div>
  <div class="map-sub" id="mapSub"></div>
  <div class="map-scroll"><div class="map-grid" id="mapGrid"></div></div>
  <div class="btn-row"><button class="big-btn btn-next" id="mapBackBtn">◀ Back</button></div>
</section>

<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
(function () {
  "use strict";

  // ===================== State & persistence (separate per mode) =====================
  var LS_KEY = "avery_app_v4";   // { mode, multiply:{best,correct,facts}, add:{best,correct,facts} }
  var SS_KEY = "avery_sess_v4";  // { multiply:{points,sinceBonus,lastA,lastB,viewToggle}, add:{...} }

  function blankStore() { return { best: 0, correct: 0, facts: {} }; }
  function normStore(s) { s = s || {}; return { best: s.best||0, correct: s.correct||0, facts: s.facts||{} }; }
  function blankSess() { return { points: 0, sinceBonus: 0, lastA: -1, lastB: -1, viewToggle: 0 }; }
  function normSess(s) { s = s || {}; return { points: s.points||0, sinceBonus: s.sinceBonus||0,
    lastA: (s.lastA==null?-1:s.lastA), lastB: (s.lastB==null?-1:s.lastB), viewToggle: s.viewToggle||0 }; }

  function loadData() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) { var s = JSON.parse(raw);
        return { mode: (s.mode==="add"?"add":"multiply"), multiply: normStore(s.multiply), add: normStore(s.add) }; }
      var v3 = localStorage.getItem("avery_mult_v3"); // migrate prior multiplication progress
      if (v3) { var o = JSON.parse(v3); return { mode: "multiply", multiply: normStore(o), add: blankStore() }; }
    } catch (e) {}
    return { mode: "multiply", multiply: blankStore(), add: blankStore() };
  }
  function loadSessAll() {
    try {
      var raw = sessionStorage.getItem(SS_KEY);
      if (raw) { var s = JSON.parse(raw); return { multiply: normSess(s.multiply), add: normSess(s.add) }; }
    } catch (e) {}
    return { multiply: blankSess(), add: blankSess() };
  }
  function saveStore() { try { data.mode = mode; localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch (e) {} }
  function saveSess() { try { sessionStorage.setItem(SS_KEY, JSON.stringify(sessData)); } catch (e) {} }

  var data = loadData();
  var sessData = loadSessAll();
  var mode = data.mode;
  var store = data[mode];      // current mode's persistent store (a reference into data)
  var sess = sessData[mode];   // current mode's session store (a reference into sessData)
  var op;                      // current operation config (set at init / switchMode)

  // ===================== Operation config (× and +) =====================
  var OPS = {
    multiply: { symbol: "×", name: "Multiply",
      compute: function (a, b) { return a * b; },
      key: function (a, b) { return Math.min(a, b) + "x" + Math.max(a, b); },
      valid: function (a, b, cap) { return a * b <= cap; },
      caps: [[15,100],[10,80],[5,60],[0,40]],   // product cap by lifetime correct
      mValue: function (a, b) { return a * b; },
      reveal: renderMultReveal },
    add: { symbol: "+", name: "Add",
      compute: function (a, b) { return a + b; },
      key: function (a, b) { return Math.min(a, b) + "+" + Math.max(a, b); },
      valid: function (a, b, cap) { return a + b <= cap; },
      caps: [[15,20],[10,17],[5,13],[0,10]],     // sum cap by lifetime correct
      mValue: function (a, b) { return a + b; },
      reveal: renderAddReveal }
  };

  function switchMode(m) {
    if (m === mode) return;
    mode = m; data.mode = m; op = OPS[m];
    store = data[m]; sess = sessData[m];
    saveStore();
    updateModeUI();
    newProblem();
    startProblemFlow();
  }
  function updateModeUI() {
    document.getElementById("segMul").className = "seg-btn" + (mode === "multiply" ? " active" : "");
    document.getElementById("segAdd").className = "seg-btn add" + (mode === "add" ? " active" : "");
  }

  // ===================== Difficulty (skill persists) =====================
  function currentCap() {
    var c = store.correct, caps = op.caps;
    for (var i = 0; i < caps.length; i++) if (c >= caps[i][0]) return caps[i][1];
    return caps[caps.length - 1][1];
  }

  // ===================== Spaced repetition (real-time Leitner) =====================
  // box 0..5 → resurface after: 25s, 3m, 10m, 1 day, 3 days, 7 days
  var INTERVALS = [25e3, 18e4, 6e5, 864e5, 2592e5, 6048e5];
  function factKey(a, b) { return Math.min(a, b) + "x" + Math.max(a, b); }

  function scheduleFact(key, ok, now) {
    var f = store.facts[key] || { box: 0, due: 0, seen: 0, correct: 0, wrong: 0, lastSeen: 0 };
    f.seen++;
    if (ok) { f.correct++; f.box = Math.min(f.box + 1, 5); }
    else    { f.wrong++;   f.box = Math.max(f.box - 1, 0); }
    f.due = now + INTERVALS[f.box];
    f.lastSeen = now;
    store.facts[key] = f;
    saveStore();
  }

  // ===================== Problem generation (scheduler + interleave) =====================
  var current = { a: 0, b: 0, key: "0x0" };

  function newProblem() {
    var now = (Date.now ? Date.now() : new Date().getTime());
    var cap = currentCap();

    // All unordered facts allowed at the current difficulty.
    var cands = [];
    for (var lo = 0; lo <= 10; lo++)
      for (var hi = lo; hi <= 10; hi++)
        if (op.valid(lo, hi, cap)) cands.push({ lo: lo, hi: hi, key: op.key(lo, hi) });

    var due = [], unseen = [], seen = [];
    for (var i = 0; i < cands.length; i++) {
      var f = store.facts[cands[i].key];
      if (!f) unseen.push(cands[i]);
      else { seen.push({ c: cands[i], f: f }); if (f.due <= now) due.push({ c: cands[i], f: f }); }
    }

    var pool, weakFirst = false;
    if (due.length) {
      due.sort(function (x, y) { return x.f.box - y.f.box || x.f.due - y.f.due; }); // weakest / most overdue first
      pool = due.map(function (d) { return d.c; }); weakFirst = true;
    } else if (unseen.length) {
      pool = unseen.slice();
    } else {
      seen.sort(function (x, y) { return x.f.due - y.f.due; });
      pool = seen.map(function (d) { return d.c; }); weakFirst = true;

    });
    var usePool = filtered.length ? filtered : pool;

    var pick;
    if (weakFirst) { var topN = Math.min(3, usePool.length); pick = usePool[Math.floor(Math.random() * topN)]; }
    else { pick = usePool[Math.floor(Math.random() * usePool.length)]; }

    var a = pick.lo, b = pick.hi;
    if (Math.random() < 0.5) { var t = a; a = b; b = t; } // random presentation order

    sess.lastA = a; sess.lastB = b; saveSess();

    typed = "";
    renderProblem();
  }

  function pressDigit(d) {
    if (typed.length >= 3) return;

  function pressBack() { typed = typed.slice(0, -1); renderTyped(); }

    if (typed === "") return;                       // must take a guess first

      svg.appendChild(svgEl("line", { x1: cx, y1: cy, x2: cx + Math.cos(th) * rx, y2: cy + Math.sin(th) * ry, stroke: color, "stroke-width": w, "stroke-linecap": "round" }));

  }

  function drawOctopus(svg, n) {

  function drawDog(svg, n) {
    svg.appendChild(svgEl("rect", { x: 20, y: 42, width: 60, height: 22, rx: 11, fill: "#c08a4e" }));

  function drawCatQuad(svg, n) {
    svg.appendChild(svgEl("rect", { x: 20, y: 44, width: 58, height: 20, rx: 10, fill: "#9aa0ad" }));
    svg.appendChild(svgEl("circle", { cx: 26, cy: 40, r: 12, fill: "#9aa0ad" }));
    svg.appendChild(svgEl("polygon", { points: "18,30 22,20 27,31", fill: "#9aa0ad" }));
    svg.appendChild(svgEl("polygon", { points: "27,30 32,21 36,31", fill: "#9aa0ad" }));

  }
  function legsUnder(svg, n, color) {
    var L = 26, R = 74;
    for (var i = 0; i < n; i++) {
      var x = (n === 1) ? 50 : L + (R - L) * (i / (n - 1));
      svg.appendChild(svgEl("rect", { x: x - 3.5, y: 62, width: 7, height: 22, rx: 3.5, fill: color }));
    }
  }
  function drawCatEars(svg, n) {
    svg.appendChild(svgEl("circle", { cx: 50, cy: 57, r: 26, fill: "#f3a93c" }));
    var spread = 18;
    for (var i = 0; i < n; i++) {
      var x = 50 + (n === 1 ? 0 : (-spread + 2 * spread * (i / (n - 1))));
      svg.appendChild(svgEl("polygon", { points: (x - 9) + ",36 " + x + ",13 " + (x + 9) + ",36", fill: "#f3a93c" }));
    }
    eyes(svg, 42, 55, 58, 55, 2.4);
    svg.appendChild(svgEl("polygon", { points: "47,62 53,62 50,67", fill: "#c46b1c" }));
    svg.appendChild(svgEl("path", { d: "M44 70 q6 5 12 0", stroke: "#c46b1c", "stroke-width": 2, fill: "none", "stroke-linecap": "round" }));
  }
  function drawHandAt(svg, x0, w, fingers, pY) {
    svg.appendChild(svgEl("rect", { x: x0, y: pY, width: w, height: 30, rx: 10, fill: "#f0c089" }));
    var fw = w / fingers;
    for (var i = 0; i < fingers; i++) {
      var cx = x0 + fw * (i + 0.5);
      svg.appendChild(svgEl("rect", { x: cx - fw * 0.32, y: pY - 22, width: fw * 0.64, height: 30, rx: fw * 0.32, fill: "#f0c089" }));
    }
  }
  function drawHand(svg, n) { drawHandAt(svg, 28, 44, n, 54); }
  function drawTwoHands(svg, n) { drawHandAt(svg, 6, 40, 5, 56); drawHandAt(svg, 54, 40, 5, 56); }
  function drawBird(svg, n) {
    for (var i = 0; i < n; i++) {
      var dir = (i % 2 === 0) ? -1 : 1;
      var cx = 50 + dir * 20;
      svg.appendChild(svgEl("ellipse", { cx: cx, cy: 52, rx: 16, ry: 9, fill: "#4aa3e0", transform: "rotate(" + (dir * 20) + " " + cx + " 52)" }));
    }
    svg.appendChild(svgEl("ellipse", { cx: 50, cy: 55, rx: 18, ry: 20, fill: "#6ec6ff" }));
    svg.appendChild(svgEl("circle", { cx: 50, cy: 34, r: 12, fill: "#6ec6ff" }));
    svg.appendChild(svgEl("polygon", { points: "50,34 37,38 50,42", fill: "#ffae42" }));
    svg.appendChild(svgEl("circle", { cx: 46, cy: 32, r: 2, fill: "#000" }));
  }
  function drawTrafficLight(svg, n) {
    var top = 14, gap = 4;
    var d = Math.min(20, (72 - (n + 1) * gap) / n);
    var boxH = n * d + (n + 1) * gap, boxW = d + 12, bx = 50 - boxW / 2;
    svg.appendChild(svgEl("rect", { x: 48, y: top + boxH, width: 4, height: Math.max(0, 92 - (top + boxH)), fill: "#555" }));
    svg.appendChild(svgEl("rect", { x: bx, y: top, width: boxW, height: boxH, rx: 6, fill: "#2c2c33" }));
    var cols = ["#ff4d4d", "#ffd84d", "#4dff77", "#7ad0ff", "#ff9d5c", "#a06bff", "#ff6fa5", "#5cd6a0", "#ffffff", "#ff77aa"];
    for (var i = 0; i < n; i++) {
      var cy = top + gap + d / 2 + i * (d + gap);
      svg.appendChild(svgEl("circle", { cx: 50, cy: cy, r: d / 2, fill: cols[i % cols.length] }));
    }
  }
  function drawRainbow(svg, n) {
    var cols = ["#ff4d4d", "#ff9d3c", "#ffd84d", "#4dff77", "#4db8ff", "#6a5bd6", "#b06bff", "#ff6fa5", "#5cd6a0", "#ffffff"];
    var cy = 80, base = 45, wAll = (base - 9) / n;
    for (var i = 0; i < n; i++) {
      var r = base - i * wAll;
      svg.appendChild(svgEl("path", { d: "M " + (50 - r) + " " + cy + " A " + r + " " + r + " 0 0 1 " + (50 + r) + " " + cy, fill: "none", stroke: cols[i % cols.length], "stroke-width": Math.max(2, wAll - 1.2) }));
    }
  }
  function drawSnail(svg, n) {
    svg.appendChild(svgEl("path", { d: "M12 76 q38 14 76 0 q-6 8 -22 8 h-32 q-16 0 -22 -8 z", fill: "#9ad06a" }));
    svg.appendChild(svgEl("circle", { cx: 82, cy: 60, r: 9, fill: "#b6e08a" }));
    svg.appendChild(svgEl("line", { x1: 86, y1: 54, x2: 90, y2: 43, stroke: "#b6e08a", "stroke-width": 3, "stroke-linecap": "round" }));
    svg.appendChild(svgEl("circle", { cx: 90, cy: 42, r: 2.4, fill: "#333" }));
    svg.appendChild(svgEl("circle", { cx: 82, cy: 58, r: 1.6, fill: "#333" }));
    for (var i = 0; i < n; i++) {
      svg.appendChild(svgEl("circle", { cx: 44, cy: 54, r: 22, fill: "#e8a04a" }));
      svg.appendChild(svgEl("circle", { cx: 44, cy: 54, r: 15, fill: "none", stroke: "#b9722a", "stroke-width": 4 }));
      svg.appendChild(svgEl("circle", { cx: 44, cy: 54, r: 7, fill: "none", stroke: "#b9722a", "stroke-width": 4 }));
    }
  }
  function drawStarfish(svg, n) {
    var cx = 50, cy = 53, R = 40, r = 17, pts = [];
    for (var i = 0; i < n; i++) {
      var ao = -Math.PI / 2 + i * 2 * Math.PI / n, ai = ao + Math.PI / n;
      pts.push((cx + Math.cos(ao) * R).toFixed(1) + "," + (cy + Math.sin(ao) * R).toFixed(1));
      pts.push((cx + Math.cos(ai) * r).toFixed(1) + "," + (cy + Math.sin(ai) * r).toFixed(1));
    }
    svg.appendChild(svgEl("polygon", { points: pts.join(" "), fill: "#ffb24d", stroke: "#f59f2e", "stroke-width": 2, "stroke-linejoin": "round" }));
    eyes(svg, 45, 50, 55, 50, 2.2, "#7a4a10");
  }
  function drawLadybug(svg, n) {
    svg.appendChild(svgEl("circle", { cx: 50, cy: 56, r: 30, fill: "#e23b3b" }));
    svg.appendChild(svgEl("line", { x1: 50, y1: 28, x2: 50, y2: 86, stroke: "#000", "stroke-width": 3 }));
    svg.appendChild(svgEl("circle", { cx: 50, cy: 26, r: 12, fill: "#222" }));
    var spots = [[38,46],[62,46],[34,61],[66,61],[40,73],[60,73],[50,57],[50,44],[30,53],[70,53]];
    for (var i = 0; i < n && i < spots.length; i++)
      svg.appendChild(svgEl("circle", { cx: spots[i][0], cy: spots[i][1], r: 5, fill: "#222" }));
  }
  function drawCycle(svg, n) {
    var L = 22, R = 78, wy = 70, wr = 14, xs = [];
    for (var i = 0; i < n; i++) xs.push(n === 1 ? 50 : L + (R - L) * (i / (n - 1)));
    var topx = (xs[0] + xs[xs.length - 1]) / 2, topy = 40;
    for (i = 0; i < n; i++) svg.appendChild(svgEl("line", { x1: xs[i], y1: wy, x2: topx, y2: topy, stroke: "#e0556f", "stroke-width": 4, "stroke-linecap": "round" }));
    svg.appendChild(svgEl("line", { x1: topx, y1: topy, x2: topx + 10, y2: 30, stroke: "#e0556f", "stroke-width": 4, "stroke-linecap": "round" }));
    svg.appendChild(svgEl("rect", { x: topx - 9, y: 36, width: 18, height: 5, rx: 2, fill: "#333" }));
    for (i = 0; i < n; i++) {
      svg.appendChild(svgEl("circle", { cx: xs[i], cy: wy, r: wr, fill: "none", stroke: "#333", "stroke-width": 4 }));
      svg.appendChild(svgEl("circle", { cx: xs[i], cy: wy, r: 2.5, fill: "#333" }));
    }
  }
  function drawCar(svg, n) {
    svg.appendChild(svgEl("rect", { x: 12, y: 38, width: 76, height: 24, rx: 8, fill: "#ff5c7a" }));
    svg.appendChild(svgEl("rect", { x: 28, y: 24, width: 40, height: 20, rx: 7, fill: "#ff8aa0" }));
    svg.appendChild(svgEl("rect", { x: 34, y: 28, width: 28, height: 13, rx: 4, fill: "#cdeaff" }));
    var trackLeft = 18, trackRight = 82, track = trackRight - trackLeft;
    var r = Math.min(9, (track / n) / 2 - 0.6);
    for (var i = 0; i < n; i++) {
      var x = trackLeft + track * ((i + 0.5) / n);
      svg.appendChild(svgEl("circle", { cx: x, cy: 70, r: r, fill: "#222", stroke: "#555", "stroke-width": 2 }));
      svg.appendChild(svgEl("circle", { cx: x, cy: 70, r: Math.max(1.4, r * 0.36), fill: "#bbb" }));
    }
  }
  function eyes(svg, x1, y1, x2, y2, r, dark) {
    r = r || 2.6; dark = dark || "#000";
    svg.appendChild(svgEl("circle", { cx: x1, cy: y1, r: r, fill: "#fff" }));
    svg.appendChild(svgEl("circle", { cx: x2, cy: y2, r: r, fill: "#fff" }));
    svg.appendChild(svgEl("circle", { cx: x1, cy: y1, r: r * 0.5, fill: dark }));
    svg.appendChild(svgEl("circle", { cx: x2, cy: y2, r: r * 0.5, fill: dark }));
  }

  // ===================== Mastery map (per mode) =====================
  var mapView = "multiply";
  function renderMap() {
    var vop = OPS[mapView], vstore = data[mapView];
    var grid = document.getElementById("mapGrid"); grid.innerHTML = "";
    var palette = ["#4a3a5a", "#6a4bd6", "#4f7fd0", "#3fa45c", "#7bd06a", "#ffd84d"];
    for (var a = 1; a <= 10; a++) {
      for (var b = 1; b <= 10; b++) {
        var f = vstore.facts[vop.key(a, b)];
        var cell = document.createElement("div"); cell.className = "map-cell";
        cell.style.background = f ? palette[Math.min(f.box, 5)] : "#23232b";
        cell.textContent = vop.mValue(a, b);
        grid.appendChild(cell);
      }
    }
    var mastered = 0;
    for (var k in vstore.facts) if (vstore.facts[k].box >= 4) mastered++;
    document.getElementById("mapTitle").textContent = "⭐ My Stars — " + (mapView === "add" ? "Adding ➕" : "Multiplying ✖️");
    document.getElementById("mapSub").textContent = mastered + (mastered === 1 ? " fact" : " facts") + " mastered! Keep going ⭐";
    document.getElementById("mapTabMul").className = "seg-btn" + (mapView === "multiply" ? " active" : "");
    document.getElementById("mapTabAdd").className = "seg-btn add" + (mapView === "add" ? " active" : "");
  }

  // ===================== Confetti =====================
  var confettiEl = document.getElementById("confetti");
  var confettiNormal = ["🎉", "⭐", "🌈", "💖", "✨", "🎈", "🦄"];
  var confettiGold = ["🌟", "⭐", "🏆", "✨", "💛", "🎉", "👑"];
  function launchConfetti(bonus) {
    confettiEl.innerHTML = "";
    var bits = bonus ? confettiGold : confettiNormal;
    var count = bonus ? 44 : 28;
    for (var i = 0; i < count; i++) {
      var s = document.createElement("span");
      s.textContent = bits[Math.floor(Math.random() * bits.length)];
      s.style.left = Math.random() * 100 + "vw";
      var dur = 2.0 + Math.random() * 1.9;
      s.style.animationDuration = dur + "s";
      s.style.animationDelay = (Math.random() * 0.5) + "s";
      s.style.fontSize = (bonus ? (24 + Math.random() * 18) : (20 + Math.random() * 14)) + "px";
      confettiEl.appendChild(s);
    }
    setTimeout(function () { confettiEl.innerHTML = ""; }, 4800);
  }

  // ===================== Gentle chime (WebAudio, no asset files) =====================
  var audioCtx = null;
  function chime(bonus) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      var notes = bonus ? [523.25, 659.25, 783.99, 1046.5, 1318.5] : [523.25, 659.25, 783.99];
      notes.forEach(function (f, idx) {
        var osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = "sine"; osc.frequency.value = f;
        var t0 = audioCtx.currentTime + idx * 0.1;
        gain.gain.setValueAtTime(0, t0);
        gain.gain.linearRampToValueAtTime(0.18, t0 + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + 0.42);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(t0); osc.stop(t0 + 0.5);
      });
    } catch (e) {}
  }

  // ===================== Init =====================
  op = OPS[mode];
  updateModeUI();
  updateScore();
  newProblem();
  startProblemFlow();
})();
